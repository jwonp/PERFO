name: Deploy Blue-Green

on:
  workflow_dispatch:
    inputs:
      frontend_tag:
        description: Frontend image tag to deploy
        required: true
        type: string
      backend_tag:
        description: Backend image tag to deploy
        required: true
        type: string
      target_color:
        description: Optional target color override
        required: false
        type: choice
        default: auto
        options:
          - auto
          - blue
          - green

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy blue-green
        run: |
          set -euo pipefail
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.target_color }}" != "auto" ]; then
            EXTRA_ARGS="--target-color ${{ github.event.inputs.target_color }}"
          fi
          bash ./scripts/deploy-bluegreen.sh \
            --env-file .env \
            --frontend-tag "${{ github.event.inputs.frontend_tag }}" \
            --backend-tag "${{ github.event.inputs.backend_tag }}" \
            ${EXTRA_ARGS}
