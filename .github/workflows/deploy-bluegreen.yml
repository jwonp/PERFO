name: Deploy Blue-Green

on:
  workflow_dispatch:
    inputs:
      frontend_tag:
        description: Frontend image tag to deploy
        required: true
        type: string
      backend_tag:
        description: Backend image tag to deploy
        required: true
        type: string
      target_color:
        description: Optional target color override
        required: false
        type: choice
        default: auto
        options:
          - auto
          - blue
          - green

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on server over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_APP_DIR }}"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            if [ "${{ github.event.inputs.target_color }}" = "auto" ]; then
              bash ./scripts/deploy-bluegreen.sh \
                --env-file .env \
                --frontend-tag "${{ github.event.inputs.frontend_tag }}" \
                --backend-tag "${{ github.event.inputs.backend_tag }}"
            else
              bash ./scripts/deploy-bluegreen.sh \
                --env-file .env \
                --target-color "${{ github.event.inputs.target_color }}" \
                --frontend-tag "${{ github.event.inputs.frontend_tag }}" \
                --backend-tag "${{ github.event.inputs.backend_tag }}"
            fi
