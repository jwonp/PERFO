server:
  port: ${SERVER_PORT:8274}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

  security:
    jwt:
      secret: ${SPRING_SECURITY_JWT_SECRET}

app:
  auth:
    preview-code-enabled: ${APP_AUTH_PREVIEW_CODE_ENABLED:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://your-domain.com}
