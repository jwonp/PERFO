server:
  port: ${SERVER_PORT:8274}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5329/perfo_prod}
    username: ${SPRING_DATASOURCE_USERNAME:perfo_prod}
    password: ${SPRING_DATASOURCE_PASSWORD:CHANGE_ME_STRONG_PASSWORD}

  security:
    jwt:
      secret: ${SPRING_SECURITY_JWT_SECRET:CHANGE_ME_MINIMUM_256_BIT_SECRET_KEY_FOR_JWT_SIGNING}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://your-domain.com}
