spring:
  application:
    name: perfo-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    jwt:
      expiration: 86400000 # 24 hours

app:
  notifications:
    bridge-url: ${NOTIFICATION_BRIDGE_URL:}
    secret: ${INTERNAL_NOTIFICATION_SECRET:}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      region: ${MINIO_REGION:ap-northeast-2}
      bucket-profile-images: ${MINIO_BUCKET_PROFILE_IMAGES:profile-images}
      public-base-url: ${MINIO_PUBLIC_BASE_URL:}
