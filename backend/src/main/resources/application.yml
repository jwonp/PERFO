server:
  port: 18080

spring:
  application:
    name: perfo-backend

  datasource:
    url: jdbc:postgresql://localhost:15432/perfo
    username: perfo
    password: perfo123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    jwt:
      secret: perfo-jwt-secret-key-change-in-production-minimum-256-bits-long
      expiration: 86400000 # 24 hours

# CORS
app:
  cors:
    allowed-origins: http://localhost:13000
