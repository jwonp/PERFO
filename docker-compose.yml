services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "12181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "19092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: perfo
      POSTGRES_PASSWORD: perfo123
      POSTGRES_DB: perfo
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- Backend ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "18080:18080"
    depends_on:
      - postgres
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/perfo
      SPRING_DATASOURCE_USERNAME: perfo
      SPRING_DATASOURCE_PASSWORD: perfo123
    profiles:
      - full

  # --- Frontend (dev) - hot reload ---
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "13000:13000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true
    profiles:
      - dev

  # --- Frontend (prod) - standalone build ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    ports:
      - "13000:13000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
    profiles:
      - full

volumes:
  redis_data:
  postgres_data:
