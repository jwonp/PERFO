services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT}:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT}:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL}
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET_PROFILE_IMAGES &&
      (mc admin user info local $$MINIO_ACCESS_KEY >/dev/null 2>&1 || mc admin user add local $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY) &&
      mc admin policy attach local readwrite --user $$MINIO_ACCESS_KEY
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_PROFILE_IMAGES: ${MINIO_BUCKET_PROFILE_IMAGES}

  # --- Backend (Prod) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      - postgres
      - redis
      - minio
      - minio-init
    environment:
      SERVER_PORT: ${BACKEND_PORT}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE}
      SPRING_SECURITY_JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_JWT_ISSUER: ${INTERNAL_API_JWT_ISSUER}
      INTERNAL_API_JWT_AUDIENCE: ${INTERNAL_API_JWT_AUDIENCE}
      INTERNAL_API_JWT_ACTIVE_KID: ${INTERNAL_API_JWT_ACTIVE_KID}
      INTERNAL_API_JWT_ACTIVE_SECRET: ${INTERNAL_API_JWT_ACTIVE_SECRET}
      INTERNAL_API_JWT_PREVIOUS_KEYS: ${INTERNAL_API_JWT_PREVIOUS_KEYS}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_REGION: ${MINIO_REGION}
      MINIO_BUCKET_PROFILE_IMAGES: ${MINIO_BUCKET_PROFILE_IMAGES}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL}
      MAIL_PROVIDER: ${MAIL_PROVIDER}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO}
      RESEND_API_URL: ${RESEND_API_URL:-https://api.resend.com}
      RESEND_API_KEY: ${RESEND_API_KEY}
    profiles:
      - full

  # --- Backend (Dev) - hot reload ---
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      - postgres
      - redis
      - minio
      - minio-init
    volumes:
      - ./backend:/app
      - ~/.gradle:/root/.gradle
    environment:
      SERVER_PORT: ${BACKEND_PORT}
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE}
      SPRING_SECURITY_JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_JWT_ISSUER: ${INTERNAL_API_JWT_ISSUER}
      INTERNAL_API_JWT_AUDIENCE: ${INTERNAL_API_JWT_AUDIENCE}
      INTERNAL_API_JWT_ACTIVE_KID: ${INTERNAL_API_JWT_ACTIVE_KID}
      INTERNAL_API_JWT_ACTIVE_SECRET: ${INTERNAL_API_JWT_ACTIVE_SECRET}
      INTERNAL_API_JWT_PREVIOUS_KEYS: ${INTERNAL_API_JWT_PREVIOUS_KEYS}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_REGION: ${MINIO_REGION}
      MINIO_BUCKET_PROFILE_IMAGES: ${MINIO_BUCKET_PROFILE_IMAGES}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL}
      MAIL_PROVIDER: ${MAIL_PROVIDER}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO}
      RESEND_API_URL: ${RESEND_API_URL:-https://api.resend.com}
      RESEND_API_KEY: ${RESEND_API_KEY}
    profiles:
      - dev

  # --- Frontend (dev) - hot reload ---
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: >
      sh -c "pnpm config set confirmModulesPurge false &&
      pnpm install --no-frozen-lockfile &&
      pnpm dev --hostname 0.0.0.0 --port ${FRONTEND_PORT}"
    environment:
      - CI=true
      - PNPM_CONFIG_CONFIRM_MODULES_PURGE=false
      - PORT=${FRONTEND_PORT}
      - WATCHPACK_POLLING=true
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - BACKEND_URL=${BACKEND_URL}
      - DATABASE_URL=${DATABASE_URL}
      - INTERNAL_API_JWT_ISSUER=${INTERNAL_API_JWT_ISSUER}
      - INTERNAL_API_JWT_AUDIENCE=${INTERNAL_API_JWT_AUDIENCE}
      - INTERNAL_API_JWT_ACTIVE_KID=${INTERNAL_API_JWT_ACTIVE_KID}
      - INTERNAL_API_JWT_ACTIVE_SECRET=${INTERNAL_API_JWT_ACTIVE_SECRET}
      - INTERNAL_API_JWT_PREVIOUS_KEYS=${INTERNAL_API_JWT_PREVIOUS_KEYS}
      - INTERNAL_API_JWT_TTL_SECONDS=${INTERNAL_API_JWT_TTL_SECONDS}
      - TICKETING_PROJECTION_READ_API_ENABLED=${TICKETING_PROJECTION_READ_API_ENABLED:-false}
      - TICKETING_PROJECTION_ALLOWED_USER_IDS=${TICKETING_PROJECTION_ALLOWED_USER_IDS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - LINE_CLIENT_ID=${LINE_CLIENT_ID}
      - LINE_CLIENT_SECRET=${LINE_CLIENT_SECRET}
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - REDIS_URL=${REDIS_URL}
    profiles:
      - dev

  # --- Frontend (prod) - standalone build ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    depends_on:
      - backend
    environment:
      - PORT=${FRONTEND_PORT}
      - NODE_ENV=production
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - BACKEND_URL=${BACKEND_URL}
      - DATABASE_URL=${DATABASE_URL}
      - INTERNAL_API_JWT_ISSUER=${INTERNAL_API_JWT_ISSUER}
      - INTERNAL_API_JWT_AUDIENCE=${INTERNAL_API_JWT_AUDIENCE}
      - INTERNAL_API_JWT_ACTIVE_KID=${INTERNAL_API_JWT_ACTIVE_KID}
      - INTERNAL_API_JWT_ACTIVE_SECRET=${INTERNAL_API_JWT_ACTIVE_SECRET}
      - INTERNAL_API_JWT_PREVIOUS_KEYS=${INTERNAL_API_JWT_PREVIOUS_KEYS}
      - INTERNAL_API_JWT_TTL_SECONDS=${INTERNAL_API_JWT_TTL_SECONDS}
      - TICKETING_PROJECTION_READ_API_ENABLED=${TICKETING_PROJECTION_READ_API_ENABLED:-false}
      - TICKETING_PROJECTION_ALLOWED_USER_IDS=${TICKETING_PROJECTION_ALLOWED_USER_IDS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - LINE_CLIENT_ID=${LINE_CLIENT_ID}
      - LINE_CLIENT_SECRET=${LINE_CLIENT_SECRET}
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - REDIS_URL=${REDIS_URL}
    profiles:
      - full

volumes:
  redis_data:
  postgres_data:
  minio_data:
